services:
  fordsync:
    build: .
    image: fordconnecttoabrpsync
    container_name: fordsync
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    # Wake/Sleep Signal endpoints — point your Cloudflare tunnel (or anything
    # else on the host) at this port. Drop the mapping if cloudflared runs
    # inside the same compose network and reaches fordsync:8080 directly.
    ports:
      - "8080:8080"
    environment:
      - Ford__ClientId=${FORD_CLIENT_ID}
      - Ford__ClientSecret=${FORD_CLIENT_SECRET}
      - Abrp__ApiKey=${ABRP_API_KEY}
      - Abrp__Token=${ABRP_TOKEN}
      # Shared secret for the /wake and /sleep Signal endpoints; without it
      # they refuse every request.
      - Signal__Secret=${SIGNAL_SECRET}
      # Optional overrides:
      # - Sync__Interval=00:00:30
      # - Sync__IdleInterval=00:30:00
      # - Sync__BoostWindow=00:10:00
      # - Ford__ApplicationId=your-application-id
